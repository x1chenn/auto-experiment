[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-experiment"
version = "0.1.0"
description = "Experiment orchestration on Slurm with a handover protocol for humans and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["PyYAML>=5.1"]

[project.scripts]
autoexp = "autoexp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
